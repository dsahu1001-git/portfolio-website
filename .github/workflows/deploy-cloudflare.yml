name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare Worker environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production') || github.event.inputs.environment || 'preview' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production') || github.event.inputs.environment || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production') || github.event.inputs.environment || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Require main for production
        if: ${{ github.event.inputs.environment == 'production' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Production deployments must run from main."
          exit 1

      - name: Deploy preview Worker
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/preview') || github.event.inputs.environment == 'preview' }}
        run: npm run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production Worker
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.environment == 'production' }}
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
